name: Deploy PC Build Advisor

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Setup SAM
        uses: aws-actions/setup-sam@v2

      - name: Build SAM application
        run: sam build --template infra/template.yaml

      - name: Deploy SAM application
        run: |
          sam deploy \
            --stack-name pc-build-avisor \
            --s3-bucket ${{ secrets.SAM_DEPLOY_BUCKET }} \
            --capabilities CAPABILITY_IAM \
            --region ap-southeast-1 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      - name: Get CloudFormation outputs
        run: |
          echo "Retrieving stack outputs..."
          LAMBDA_URL=$(aws cloudformation describe-stacks \
            --stack-name pc-build-avisor \
            --region ap-southeast-1 \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaFunctionUrl'].OutputValue" \
            --output text)
          
          BUCKET_NAME=$(aws cloudformation describe-stacks \
            --stack-name pc-build-avisor \
            --region ap-southeast-1 \
            --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" \
            --output text)
          
          echo "LAMBDA_URL=$LAMBDA_URL" >> $GITHUB_ENV
          echo "BUCKET_NAME=$BUCKET_NAME" >> $GITHUB_ENV
          
          echo "Lambda URL: $LAMBDA_URL"
          echo "Bucket: $BUCKET_NAME"

      - name: Update frontend with Lambda URL
        run: |
          sed -i "s|__URL_PC_BUILD_RECOMMENDATION__|${{ env.LAMBDA_URL }}|g" frontend/index.html

      - name: Upload frontend to S3
        run: |
          aws s3 sync frontend/ s3://${{ env.BUCKET_NAME }}/ \
            --cache-control no-cache \
            --region ap-southeast-1

      - name: Print deployment summary
        run: |
          echo "=========================================="
          echo "✓ Deployment Complete!"
          echo "=========================================="
          echo "Website URL:"
          aws cloudformation describe-stacks \
            --stack-name pc-build-avisor \
            --region ap-southeast-1 \
            --query "Stacks[0].Outputs[?OutputKey=='WebsiteUrl'].OutputValue" \
            --output text
          echo "=========================================="

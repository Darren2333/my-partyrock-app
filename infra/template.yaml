AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: PC Build Advisor - Serverless Lambda + S3 Application

Globals:
  Function:
    Timeout: 60
    MemorySize: 256
    Runtime: python3.12

Resources:
  # IAM Role for Lambda with Bedrock permissions only
  AppBedrockRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: BedrockAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: arn:aws:bedrock:*::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0-20260217-v1:0

  # Lambda Function - PC Build Recommendation
  PCBuildRecommendationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/pc_build_recommendation/
      Handler: index.lambda_handler
      Runtime: python3.12
      Role: !GetAtt AppBedrockRole.Arn
      Timeout: 60
      MemorySize: 256
      FunctionUrlConfig:
        AuthType: NONE

  # S3 Bucket for Frontend
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub pc-build-advisor-${AWS::AccountId}-${AWS::Region}
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  # S3 Bucket Policy
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub ${FrontendBucket.Arn}/*

Outputs:
  LambdaFunctionUrl:
    Description: Lambda Function URL for API
    Value: !GetAtt PCBuildRecommendationFunctionUrl.FunctionUrl
    Export:
      Name: PCBuildAdvisorLambdaUrl

  WebsiteUrl:
    Description: Frontend Website URL
    Value: !GetAtt FrontendBucket.WebsiteURL
    Export:
      Name: PCBuildAdvisorWebsiteUrl

  BucketName:
    Description: Frontend S3 Bucket
    Value: !Ref FrontendBucket
    Export:
      Name: PCBuildAdvisorBucket
